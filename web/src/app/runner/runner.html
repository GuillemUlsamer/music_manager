<button (click)="run('Brain Damage')" [disabled]="api.running()">Run</button>
@if (api.running()) {
    <button (click)="stop()">Stop</button>
}
<button (click)="copyLog()" [disabled]="api.running()">Copy Log</button>

@for (row of rows(); track row.id) {
    <div class="row">
        <span>{{ row.text }}</span>
        <span class="status" [class]="row.tag">{{ row.status }}</span>
    </div>
}

@for (line of lines(); track $index) {
    <div class="line">{{ line }}</div>
}
