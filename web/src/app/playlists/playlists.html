<h1>Playlists</h1>
<p>{{ playlists().length }} playlists available</p>
<button (click)="load()" [disabled]="loading()">Refresh</button>
<div class="grid">
    @for (p of playlists(); track p.name) {
        <a class="card" [routerLink]="['/run', p.name]">
            <img [src]="cover(p.name)" [alt]="p.name" />
            <span>{{ p.name }}</span>
        </a>
    }
    @if (loading()) {
        <span>Loading playlists from Drive...</span>
    }
</div>
